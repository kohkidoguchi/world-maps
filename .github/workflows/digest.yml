name: News Digest

on:
  schedule:
    # 主経路は GitHub の cron ではない：Claude Code のクラウド routine が毎日 06:00 JST に
    # 「[digest]」空コミットを push し、下の push トリガーで即時実行する（cron は発火率 15% 程度で
    # 06:13 の配信 cron は一度も動かなかった）。以下の cron は予備。--replies は
    # 「当日分が未配信なら配信する」自己修復を含むので、どれか一つ走れば届く。
    - cron: '13 21 * * *'         # every day 06:13 JST — digest (backup)
    - cron: '13 22 * * 6'         # Sun 07:13 JST — FRONTIER (backup)
    - cron: '17,47 0-14 * * *'    # replies: JST 09:17-23:47 daily
    - cron: '17,47 22-23 * * *'   # replies: JST 07:17-08:47 daily
  push:
    branches: [main]              # commit message に [digest] があれば --replies（自己修復つき）を即実行
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition'
        required: false
        default: 'replies'
        type: choice
        options: [morning, evening, future, replies]
      only:
        description: 'Send only to this address (test)'
        required: false
        default: ''

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[digest]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECRETS_READY: ${{ secrets.GMAIL_ADDRESS != '' && secrets.GMAIL_APP_PASSWORD != '' && secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Secrets check
        run: |
          if [ "$SECRETS_READY" != "true" ]; then
            echo "::warning::GMAIL_ADDRESS / GMAIL_APP_PASSWORD / ANTHROPIC_API_KEY が未設定のためスキップ（Settings > Secrets に登録すると動き始めます）"
          fi
      - uses: actions/checkout@v4
        if: env.SECRETS_READY == 'true'
      - uses: actions/setup-python@v5
        if: env.SECRETS_READY == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: news_digest/requirements.txt
      - run: pip install -r news_digest/requirements.txt
        if: env.SECRETS_READY == 'true'

      - name: Restore state (seen articles, recent topics, answered replies)
        if: env.SECRETS_READY == 'true'
        uses: actions/cache@v4
        with:
          path: |
            news_digest/seen_articles.json
            news_digest/recent_topics.json
            news_digest/reply_log.json
            news_digest/sent_log.json
          key: digest-state-${{ github.run_id }}
          restore-keys: |
            digest-state-

      - name: Determine mode
        if: env.SECRETS_READY == 'true'
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "flag=--${{ inputs.edition }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "13 21 * * *" ]; then
            echo "flag=--morning" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "13 22 * * 6" ]; then
            echo "flag=--future" >> $GITHUB_OUTPUT
          else
            echo "flag=--replies" >> $GITHUB_OUTPUT   # schedule(返信) と push([digest]) はここ
          fi
          echo "mode: $(cat $GITHUB_OUTPUT)"

      - name: Run
        if: env.SECRETS_READY == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DUNSRI_GMAIL_APP_PASSWORD: ${{ secrets.DUNSRI_GMAIL_APP_PASSWORD }}
          DUNSRI_ADDRESS: ${{ secrets.DUNSRI_ADDRESS }}
          USER_PROFILE: ${{ secrets.USER_PROFILE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DIGEST_ONLY: ${{ inputs.only }}
        run: cd news_digest && python digest.py ${{ steps.mode.outputs.flag }}
