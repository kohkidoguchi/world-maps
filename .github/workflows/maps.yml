name: World Maps

on:
  schedule:
    - cron: '0 18 * * 0'   # Mon 03:00 JST — ahead of the Monday digest (06:00 JST)
    - cron: '0 18 * * 3'   # Thu 03:00 JST — ahead of the Thursday digest
  workflow_dispatch:
  push:
    branches: [main]       # only builds when the commit message contains [build]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore data caches (GDELT zips, corp headlines/events)
        uses: actions/cache@v4
        with:
          path: |
            geopolitics_map/data
            corp_activity_map/data
            capital_flows/data/vintages
            research_map/data
          key: maps-data-${{ github.run_id }}
          restore-keys: |
            maps-data-

      # ── ビルド：ログは out/build.log に集約し、サイトと一緒に公開する（非ログインで読める）。
      #    どちらかが失敗しても止めず、キャッシュ済みデータで組み立てを続ける。
      - name: Start build log
        run: |
          mkdir -p out
          echo "== build $(date -u +%FT%TZ) run=${{ github.run_id }} sha=${{ github.sha }} ==" > out/build.log

      - name: Build geopolitics map
        continue-on-error: true
        run: |
          set -o pipefail
          echo "--- geopolitics_map/build.py ---" >> out/build.log
          (cd geopolitics_map && python build.py) 2>&1 | tee -a out/build.log

      - name: Build corporate activity map
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          echo "--- corp_activity_map/build.py ---" >> out/build.log
          (cd corp_activity_map && python build.py) 2>&1 | tee -a out/build.log

      - name: Ensure corp web/data.json (rebuild from cached events if the build failed)
        continue-on-error: true
        run: |
          set -o pipefail
          echo "--- corp_activity_map/build.py --json ---" >> out/build.log
          (cd corp_activity_map && python build.py --json) 2>&1 | tee -a out/build.log

      # 資本フロー：統計ベース(observations.csv.gz, コミット済み)に直近の価格だけ差し替えて再生成
      - name: Build capital-flows nowcast (prices refresh)
        continue-on-error: true
        run: |
          set -o pipefail
          echo "--- capital_flows: prices refresh ---" >> out/build.log
          cd capital_flows
          [ -f data/observations.csv ] || gunzip -k data/observations.csv.gz
          (python build.py --only prices && python build.py --matrix-json) 2>&1 | tee -a ../out/build.log

      # 研究マップ：直近3週間の新着で状態を更新（OpenAlex 無料枠 ~150 req）。状態は Actions cache に累積。
      - name: Update research map (OpenAlex)
        continue-on-error: true
        run: |
          set -o pipefail
          echo "--- research_map/build.py --update ---" >> out/build.log
          (cd research_map && python build.py --update) 2>&1 | tee -a out/build.log

      - name: Ensure research web/data.json (offline rebuild)
        continue-on-error: true
        run: |
          set -o pipefail
          echo "--- research_map/build.py --rebuild ---" >> out/build.log
          (cd research_map && python build.py --rebuild) 2>&1 | tee -a out/build.log

      # ── 組み立て：各工程のログを out/build.log に残し、Pages と一緒に公開する（サインイン不要で読める）
      - name: Copy web/ -> out/
        run: |
          mkdir -p out/geo out/corp out/capital out/research
          cp -r geopolitics_map/web/.   out/geo/
          cp -r corp_activity_map/web/. out/corp/
          cp -r capital_flows/web/.     out/capital/  && cp out/capital/matrix.html out/capital/index.html
          cp -r research_map/web/.      out/research/
          echo "--- web/ contents ---" >> out/build.log
          ls -la geopolitics_map/web corp_activity_map/web >> out/build.log 2>&1

      - name: Export summaries
        continue-on-error: true
        run: python tools/export_summary.py 2>&1 | tee -a out/build.log

      - name: Render screenshots (Playwright)
        continue-on-error: true
        run: python tools/render.py 2>&1 | tee -a out/build.log

      - name: Build index page
        continue-on-error: true
        run: python tools/make_index.py 2>&1 | tee -a out/build.log

      - name: Site tree
        run: (du -sh out; find out -maxdepth 2 -type f -not -path '*/lib/*' -exec ls -la {} +) 2>&1 | tee -a out/build.log

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
